<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A5 Редактор</title>

  <!-- Styles -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/editor.css">

  <!-- Libs (defer — executed after DOM parse, before modules) -->
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script defer src="js/supabase.js"></script>
  <script defer src="js/utils.js"></script>
  <script defer src="js/print.js"></script>
  <script defer src="js/include.js"></script>
  <script defer src="js/components/nav-alpine.js"></script>
  <!-- App (ES module — imports Alpine.js, runs after defer scripts) -->
  <script type="module" src="js/editor.js"></script>
</head>

<body x-data="a5Editor">
  <!-- Navigation -->
  <include src="partials/nav.html"></include>

  <div class="app-layout">
    <!-- Editor -->
    <div class="editor-panel">
      <h2>Редактор</h2>
      <div class="editor-main">
        <div class="editor-fields">
          <textarea
            x-model="text"
            placeholder="Введіть основний текст..."
          ></textarea>
          <div>
            <label for="bottomInput">Нижній текст:</label>
            <input
              id="bottomInput"
              type="text"
              x-model="bottom"
              placeholder="Введіть текст для нижньої частини..."
            >
          </div>
          <div class="save-controls">
            <input
              type="text"
              x-model="saveName"
              @input="updateSaveLabel()"
              placeholder="Ім'я для збереження"
            >
            <button @click="save()" x-html="renderTextWithIcons('Зберегти :save:')"></button>
            <button class="secondary" @click="exportData()" x-html="renderTextWithIcons('Експорт :export:')"></button>
            <button class="secondary" @click="$refs.importInput.click()" x-html="renderTextWithIcons('Імпорт :import:')"></button>
          </div>
        </div>
        <div class="saved-sidebar">
          <input
            type="text"
            x-model="search"
            placeholder="Пошук..."
          >
          <small x-show="savedDate" x-text="'Збережено: ' + savedDate"></small>
          <ul class="saved-list">
            <template x-for="item in filteredSets" :key="item.name">
              <li
                :aria-selected="selectedName === item.name"
                @click="load(item.name)"
              >
                <span x-text="item.name + (item.date ? ' (' + item.date + ')' : '')"></span>
                <button class="del-btn" @click.stop="confirmDelete(item.name)" title="Видалити">×</button>
              </li>
            </template>
          </ul>
        </div>
      </div>
    </div>

    <!-- Preview -->
    <div class="preview-panel">
      <div class="page" id="contentToCapture">
        <div class="page-content" x-html="renderTextWithIcons(text)"></div>
        <div class="page-input">
          <span x-html="renderTextWithIcons(bottom)" x-show="bottom"></span>
        </div>
      </div>
      <button @click="preparePrint()" x-html="renderTextWithIcons('Друк :print:')"></button>
    </div>
  </div>

  <!-- Print container -->
  <div id="printContainer"></div>

  <!-- Hidden file input -->
  <input type="file" x-ref="importInput" accept=".json" style="display:none" @change="importData($event)">

  <!-- Confirm modal -->
  <dialog x-ref="confirmDialog">
    <article class="dialog-card">
      <header>
        <button aria-label="Close" rel="prev" @click="$refs.confirmDialog.close()"></button>
        <p><strong>Підтвердження</strong></p>
      </header>
      <p x-text="confirmMessage"></p>
      <footer>
        <button class="secondary" @click="$refs.confirmDialog.close()">Скасувати</button>
        <button @click="confirmCallback(); $refs.confirmDialog.close()">OK</button>
      </footer>
    </article>
  </dialog>
</body>
</html>
