<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Виробництво</title>

  <!-- Styles -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/production.css">

  <!-- Libs (defer — executed after DOM parse, before modules) -->
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="js/supabase.js"></script>
  <script defer src="js/utils.js"></script>
  <!-- App (ES module — imports Alpine.js, runs after defer scripts) -->
  <script type="module" src="js/production.js"></script>
</head>

<body x-data="productionTracker">
  <!-- Navigation -->
  <nav class="app-nav no-print">
    <span class="nav-brand">Мілекс</span>
    <a href="index.html">A5 Редактор</a>
    <a href="production.html" aria-current="page">Виробництво</a>
    <a href="price.html">Прайс</a>
  </nav>

  <div class="app-layout">
    <!-- Editor: unfilled days -->
    <div class="editor-panel no-print">
      <h2>Незаповнені дні</h2>
      <template x-if="unfilledDays.length === 0">
        <p class="text-muted">Всі дні заповнено ✓</p>
      </template>
      <template x-for="day in unfilledDays" :key="day.dateKey">
        <div class="day-entry">
          <h3 x-text="day.label"></h3>
          <table class="product-table">
            <thead>
              <tr>
                <template x-for="p in products" :key="p">
                  <th x-text="p"></th>
                </template>
              </tr>
            </thead>
            <tbody>
              <tr>
                <template x-for="p in products" :key="p">
                  <td>
                    <input type="number" min="0"
                      :data-product="p"
                      :data-date="day.dateKey"
                      x-model.number="day.inputs[p]"
                      @keydown.enter.prevent="saveDayAndFocusNext(day)"
                    >
                  </td>
                </template>
              </tr>
            </tbody>
          </table>
          <div class="day-actions">
            <button class="btn-dayoff" @click="markDayOff(day)">Вихідний</button>
            <button @click="saveDay(day)">Зберегти</button>
          </div>
        </div>
      </template>
      <p x-show="!canEdit && selectedMonthKey !== currentMonthKey">
        Редагування для цього періоду недоступне.
      </p>
    </div>

    <!-- Preview: production table -->
    <div class="preview-panel">
      <h2 class="no-print">Виробництво за місяць</h2>
      <div class="controls-row no-print">
        <select x-model="selectedMonthKey" @change="onMonthChange()">
          <template x-for="opt in monthOptions" :key="opt.value">
            <option :value="opt.value" x-text="opt.label"></option>
          </template>
        </select>
        <label style="display:flex;align-items:center;gap:5px;margin:0">
          <input type="checkbox" x-model="isPieces" @change="onUnitChange()" style="margin:0"> шт
        </label>
      </div>

      <div class="print-title" x-text="printTitle" x-show="printTitle"></div>

      <table class="production-table">
        <thead>
          <tr>
            <th></th>
            <template x-for="p in products" :key="p">
              <th x-text="p"></th>
            </template>
          </tr>
        </thead>
        <tbody>
          <template x-for="row in tableRows" :key="row.dateKey">
            <tr>
              <td class="td-date">
                <div class="date-cell-content">
                  <button x-show="row.hasData" type="button" class="delete-day-btn"
                    @click="deleteDay(row.dateKey)" title="Видалити">×</button>
                  <span x-text="row.dateLabel"></span>
                </div>
              </td>
              <template x-for="p in products" :key="p">
                <td
                  :class="row.isDayOff ? 'day-off-cell' : (row.hasData ? 'fw-600' : '')"
                  x-text="row.isDayOff ? '' : (row.hasData ? formatValue(row.values[p]) : '')"
                ></td>
              </template>
            </tr>
          </template>
        </tbody>
      </table>

      <!-- Summary -->
      <table class="summary-table" x-show="showSummary">
        <thead>
          <tr>
            <th>Всього</th>
            <template x-for="p in products" :key="p">
              <th x-text="p"></th>
            </template>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="fw-600">ПІДСУМОК</td>
            <template x-for="p in products" :key="p">
              <td class="fw-600" x-text="formatValue(totals[p])"></td>
            </template>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Confirm modal -->
  <dialog x-ref="confirmDialog">
    <article>
      <header>
        <button aria-label="Close" rel="prev" @click="$refs.confirmDialog.close()"></button>
        <p><strong>Підтвердження</strong></p>
      </header>
      <p x-text="confirmMessage"></p>
      <footer>
        <button class="secondary" @click="$refs.confirmDialog.close()">Скасувати</button>
        <button @click="confirmCallback(); $refs.confirmDialog.close()">OK</button>
      </footer>
    </article>
  </dialog>
</body>
</html>
